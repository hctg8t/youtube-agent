name: Run YouTube Agent

on:
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check Files and Run Script
      working-directory: ${{ github.workspace }}
      run: |
        pwd
        ls -la
        python main.py
